<html>
  <head>
    <meta charset="utf-8" />
    <title>Facing Worlds</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico" />
    <meta
      name="description"
      content="" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta
      name="format-detection"
      content="telephone=no" />
    <meta
      name="msapplication-tap-highlight"
      content="no" />

    <!-- Load A-Frame and Extras from local files -->
    <script src="./assets/libraries/aframe/aframe.min.js"></script>
    <script src="./assets/libraries/aframe-extras.min.js"></script>

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="styles.css" />

    <!-- HTTPS Redirect -->
    <script>
      // Automatically redirect HTTP to HTTPS
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        location.replace("https:" + window.location.href.substring(window.location.protocol.length));
      }
    </script>

    <!-- Load main game script as module -->
    <script
      src="./src/game/core/main.js"
      type="module"
      defer></script>
  </head>
  <body>
    <a-scene
      gltf-viewer-settings
      console-suppression
      loading-screen="enabled: false"
      xr-mode-ui="enabled: false"
      renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmicToneMapping; antialias: false; precision: low">
      <!-- Space Environment -->
      <a-entity
        space-environment="enabled:true; starCount:200; asteroidCount:0; asteroidSpeed:0.5; nebulaEnabled:false; backgroundColor:#000000"></a-entity>

      <!-- Earth Sphere (Distant Planet) -->
      <a-entity
        earth-sphere="enabled:true; distance:100; size:60; rotationSpeed:0.005; atmosphereColor:#4db2ff; atmosphereIntensity:0.8"></a-entity>

      <!-- Background Music -->
      <a-entity background-music="enabled:true; volume:0.8; loop:true; autoplay:false; startOnFirstBullet:true"></a-entity>
      <a-assets>
        <a-asset-item
          id="world-gltf"
          src="assets/3d/map/FacingWorlds_tex_5.gltf"></a-asset-item>
        <a-asset-item
          id="navmesh-gltf"
          src="assets/3d/navmesh.gltf"></a-asset-item>

        <!-- Weapon Assets -->
        <a-asset-item
          id="enforcer-weapon"
          src="assets/3d/enforcer.glb"></a-asset-item>

        <!-- Audio Assets (Performance Optimized) -->
        <audio
          id="background-music"
          src="assets/audio/110-van_den_bos--foregone_destruction-i-gameplay-audio.mp3"
          preload="metadata"></audio>
        <audio
          id="fire-sound"
          src="assets/audio/fire.wav"
          preload="none"></audio>
      </a-assets>

      <!-- fixed camera (no look-controls) -->

      <!-- Ambient Light (Neutral Environment) -->
      <a-entity
        light="color: #ffe2c2; groundColor: #7c5c46; decay: 6.82; intensity: 0.5; type: hemisphere"
        position="3.91645 6.02928 0"></a-entity>

      <!-- Additional Ambient Light (Light Yellow)
      <a-entity
        light="type:ambient; intensity:0.4; color:#ffff99"
        position="0 0 0"></a-entity> -->

      <!-- Additional Ambient Light for Better Illumination
      <a-entity
        light="type:ambient; intensity:0.3; color:#ffffff"
        position="0 0 0"></a-entity> -->

      <!-- Bright Ambient Light for Enhanced Scene Illumination
      <a-entity
        light="type:ambient; intensity:0.6; color:#ffffff"
        position="0 0 0"></a-entity> -->

      <!-- Directional Light (Direct Lighting)
      <a-entity
        light="type:directional; intensity:1.1; color:#f2b000; castShadow:true"
        position="10 20 10"
        rotation="-45 45 0"></a-entity> -->

      <!-- Earth Illumination Light (Pointed at Earth)
      <a-entity
        light="type:directional; intensity:0.8; color:#fffaeb; castShadow:false"
        position="80 20 -50"
        rotation="-30 0 0"></a-entity> -->

      <!-- Map Lights Group -->
      <a-entity id="map-lights">
        <!-- Additional Ambient Light for Map Area -->
        <a-entity
          light="color: #ffffff; intensity: 0.6; type: ambient"
          position="44.40337 3.60006 -0.55222"></a-entity>

        <!-- Single Fill Light for Bottom Illumination (Performance Optimized) -->
        <a-entity
          light="type:point; intensity:4; color:#f2b000; castShadow:false; distance:25; decay:0.5"
          position="0 8 0"></a-entity>

        <!-- Blue Lights Group -->
        <a-entity id="blue-lights">
          <!-- Blue Spot Light -->
          <a-entity
            light="angle: 70; color: #c8dcf4; decay: 0.4; intensity: 2; penumbra: 0.1; type: spot; shadowCameraFov: 0"
            position="-39.02148 5.75842 0.46228"
            rotation="-90 0 0"></a-entity>

          <!-- Blue Point Lights (Left Side) - Performance Optimized -->
          <a-entity
            light="type:point; intensity:8; color:#4A90E2; castShadow:false; distance:8; decay:1.0"
            position="-24.3 14.6 -4"></a-entity>
          <a-entity
            light="type:point; intensity:8; color:#4A90E2; castShadow:false; distance:8; decay:1.0"
            position="-24.3 14.6 4"></a-entity>
          <a-entity
            light="type:point; intensity:6; color:#0008ff; castShadow:false; distance:10; decay:0.8"
            position="-32.3 32.9 -2.57"></a-entity>
          <a-entity
            light="type:point; intensity:6; color:#0008ff; castShadow:false; distance:10; decay:0.8"
            position="-32.3 32.9 2.05"></a-entity>
        </a-entity>

        <!-- Red Lights Group -->
        <a-entity id="red-lights">
          <!-- Red Spot Light -->
          <a-entity
            light="angle: 70; color: #f4c8c8; decay: 0.4; intensity: 2; penumbra: 0.1; type: spot; shadowCameraFov: 0"
            position="41.97017 5.75842 -5.09718"
            rotation="-90 0 0"></a-entity>

          <!-- Red Point Lights (Right Side) - Performance Optimized -->
          <a-entity
            light="type:point; intensity:8; color:#E24A4A; castShadow:false; distance:8; decay:1.0"
            position="34.4 10.7 -10.4"></a-entity>
          <a-entity
            light="type:point; intensity:8; color:#E24A4A; castShadow:false; distance:8; decay:1.0"
            position="34.4 10.7 -0.6"></a-entity>
          <a-entity
            light="type:point; intensity:6; color:#E24A4A; castShadow:false; distance:10; decay:0.8"
            position="41.6 32.6 -7.30393"></a-entity>
          <a-entity
            light="type:point; intensity:6; color:#E24A4A; castShadow:false; distance:10; decay:0.8"
            position="41.6 32.6 -2.85067"></a-entity>
        </a-entity>
      </a-entity>

      <!-- World + NavMesh (Performance Optimized) -->
      <a-entity
        id="world"
        gltf-model="#world-gltf"
        gltf-animation-pointer="enabled:true; autoPlay:true; speed:1.0"
        -advanced-material-animation="enabled:false; animationType:opacity; speed:1.0; intensity:1.0; minValue:0.5; maxValue:0.5; emissiveGlow:false"
        pixelated-texture
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"></a-entity>
      <a-entity
        id="navmesh"
        gltf-model="#navmesh-gltf"
        nav-mesh
        visible="false"
        position="0 0 0"
        rotation="0 0 0"
        scale="1 1 1"></a-entity>

      <!-- soldier -->

      <!-- Player rig (built-in movement-controls) -->
      <!-- Player Rig (moves and rotates) -->
      <a-entity
        id="rig"
        movement-controls="constrainToNavMesh: true; speed: 0.4; fly: false"
        rotate-yaw
        position="0 0 0">
        <!-- Soldier Body (follows rig movement, fixed rotation) -->
        <a-entity
          id="soldier"
          gltf-model="https://threejs.org/examples/models/gltf/Soldier.glb"
          character="idleIdx:0; walkIdx:3; runIdx:1"
          health="max:100; current:100"
          invisible-to-player="enabled: true"
          local-player="true"
          position="0 0 0"
          rotation="0 0 0">
        </a-entity>

        <!-- Camera (child of rig, follows movement and rotation) -->
        <a-entity
          id="cam"
          camera="active: true"
          look-controls="enabled: true"
          position="0 1.4 0"
          first-person-weapon="enabled: true; muzzleOffset: 0.8 0.1 0">
          <!-- Weapon (child of camera, follows look direction) -->
          <a-entity
            id="player-weapon"
            gltf-model="assets/3d/enforcer.glb"
            scale="0.025 0.025 0.025"
            position="0.2 -0.3 -0.5"
            weapon-sway="enabled: true; swayIntensity: 0.001; swaySpeed: 6.0; bobIntensity: 0.0; bobSpeed: 0.0; walkMultiplier: 1.0; runMultiplier: 1.5; smoothing: 0.2">
            <!-- Muzzle point (position this at the tip of the weapon barrel) -->
            <a-entity
              id="weapon-muzzle"
              position="0 1 -1"
              geometry="primitive: sphere; radius: 0.01"
              material="opacity: 0.8; transparent: true; color: red"
              visible="false">
            </a-entity>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Highscore Display -->
      <a-entity highscore-display="enabled: true; maxPlayers: 10; updateInterval: 1000"></a-entity>

      <!-- Credits Display -->
      <div id="credits-container">
        <div class="credit-line credit-instructions">
          1 finger tap to move forward, 2 fingers to move backward, move finger or camera to look around, fire to… fire. Game on!
        </div>
        <div class="credit-line">
          Made by
          <a
            href="https://www.instagram.com/jnsjohansson"
            target="_blank"
            class="credit-author"
            >Jonas Johansson</a
          >
        </div>
        <div class="credit-line credit-highlight">3D Model by Harry Clark</div>
        <div class="credit-link">
          <a href="ar/">View Facing Worlds in AR, click this link and point your camera towards the sticker.</a>
        </div>
      </div>

      <!-- Kill Notification -->
      <a-entity kill-notification="enabled: true; duration: 3000; fadeInDuration: 500; fadeOutDuration: 1000"></a-entity>
    </a-scene>
  </body>
</html>
