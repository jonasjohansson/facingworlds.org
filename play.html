<html>
  <head>
    <meta charset="utf-8" />
    <title>Facing Worlds</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="favicon.ico" />
    <meta
      name="description"
      content="" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta
      name="format-detection"
      content="telephone=no" />
    <meta
      name="msapplication-tap-highlight"
      content="no" />

    <!-- Load A-Frame and Extras from local files -->
    <!--
      three r180, vendored, shared with the AR page. No A-Frame: the scene is built in
      src/game/scene/world.js and the systems registered in src/game/core/main-three.js.
      The stock three addons (post-processing, loaders) import the bare specifier "three",
      which this import map resolves to the one copy on the site.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "./assets/libraries/three/three.module.min.js"
        }
      }
    </script>

    <!-- Custom CSS -->
    <link
      rel="stylesheet"
      href="styles.css" />

    <!-- HTTPS Redirect -->
    <script>
      // Automatically redirect HTTP to HTTPS
      if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        location.replace("https:" + window.location.href.substring(window.location.protocol.length));
      }
    </script>

    <!-- Load main game script as module -->
    <script
      src="./src/game/core/main-three.js"
      type="module"
      defer></script>
  </head>
  <body>
    <!--
      antialias and highp precision are baked into the WebGL context at creation time and
      live in engine/game.js; tone mapping, exposure and shadows are set there too. Light
      intensities are physical units (the only mode three r180 has); see scene/lights.js.
    -->
    <canvas id="game"></canvas>

      <!-- Credits Display -->
      <div id="credits-container">
        <!-- A "?" in the corner; UT99 draws nothing here, so the controls and
             credits stay out of the HUD until asked for (click, or hover on a
             mouse). Only one of the two instruction lines is ever shown. -->
        <button type="button" class="credit-toggle" aria-expanded="false" aria-controls="credit-panel" title="Controls and credits">?</button>
        <div id="credit-panel" class="credit-panel">
          <div class="credit-line credit-instructions credit-instructions--desktop">
            WASD move &middot; mouse look &middot; Space jump &middot; X or click fire &middot; Tab scores
          </div>
          <div class="credit-line credit-instructions credit-instructions--touch">
            1 finger to move forward, 2 fingers to move backward, drag or turn the phone to look, tap fire to fire.
          </div>
          <div class="credit-line">
            Made by
            <a href="https://www.instagram.com/jnsjohansson" target="_blank" class="credit-author">Jonas Johansson</a>
          </div>
          <div class="credit-line credit-highlight">3D Model by Harry Clark</div>
          <div class="credit-link">
            <a href="ar/">View Facing Worlds in AR: open this on a phone and point it at the sticker.</a>
          </div>
        </div>
      </div>
  </body>
</html>
