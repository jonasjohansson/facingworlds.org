<!DOCTYPE html>
<!--
  A-Frame fallback for the AR experience.

  This is the page that shipped before the pure-Three.js rewrite in ar/index.html,
  kept verbatim (minus the idle spin and the VR button) as a known-good reference: a
  phone has been confirmed to track with it. Reach it at /ar/aframe.html.

  It is deliberately self-contained - it loads src/ar/core/main.js directly, not
  ../ar.js - so nothing done to the pure-Three.js page can break it.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta
      name="theme-color"
      content="#000000" />
    <title>Facing Worlds AR (A-Frame fallback)</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      .a-dialog-allow-button {
        background-color: #4caf50;
        color: white;
      }
      .a-dialog-deny-button {
        background-color: #f44336;
        color: white;
      }
      .a-dialog-ok-button {
        background-color: #2196f3;
        color: white;
      }
    </style>

    <!-- A-Frame (includes Three.js). Same local build the game uses, so the AR
         page and the game can never drift apart on version, and the page works
         offline once cached. -->
    <script src="../assets/libraries/aframe/aframe.min.js"></script>

    <!-- Suppress Three.js lighting deprecation warning -->
    <script>
      // Suppress the useLegacyLights deprecation warning
      const originalWarn = console.warn;
      console.warn = function (message) {
        if (message && message.includes("useLegacyLights has been deprecated")) {
          return; // Suppress this specific warning
        }
        originalWarn.apply(console, arguments);
      };
    </script>

    <!-- Load encantar libraries synchronously (required before scene initialization) -->
    <script src="../assets/libraries/encantar/encantar.min.js"></script>
    <script src="../assets/libraries/encantar/plugins/aframe-with-encantar.min.js"></script>
    <script src="../assets/libraries/encantar/addons/ar-scan-gimmick.min.js"></script>

    <!-- A-Frame AR components. Loaded straight from src/ar/core/main.js rather than
         through ../ar.js: ar.js is the entry point of the pure-Three.js page now, and
         this fallback must not depend on it. A deferred module runs before
         DOMContentLoaded, and the scene cannot finish loading before its
         <a-asset-item> resolves, so every component below is registered well before
         any entity initialises. -->
    <script
      type="module"
      src="../src/ar/core/main.js"></script>
  </head>
  <body>
    <!-- No renderer="" here on purpose: encantar rewrites that attribute with its
         own { alpha: true } while the scene initialises, so anything declared in
         markup is dropped before the renderer is built. Tone mapping and exposure
         are set on the renderer by ar-lighting instead. -->
    <a-scene
      encantar="stats: false; gizmos: false"
      shadow="type: pcfsoft"
      loading-screen="enabled: false"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
      ar-music>
      <a-assets>
        <!-- Facing Worlds map. Preloaded here and referenced by selector below,
             so the glTF is fetched once instead of twice. -->
        <a-asset-item
          id="facing-worlds-map"
          src="../assets/3d/map/FacingWorlds_tex_5.gltf"></a-asset-item>
      </a-assets>

      <ar-sources>
        <ar-camera-source></ar-camera-source>
      </ar-sources>

      <ar-trackers>
        <ar-image-tracker>
          <ar-reference-image
            name="tracker"
            src="../assets/images/tracker.jpg"></ar-reference-image>
        </ar-image-tracker>
      </ar-trackers>

      <ar-viewport>
        <ar-hud>
          <ar-scan-gimmick opacity="0.75"></ar-scan-gimmick>
        </ar-hud>
      </ar-viewport>

      <ar-camera></ar-camera>

      <!-- Marker space: the print lies in the XY plane, +Z points out of it.
           Lighting lives on the root so the key direction and the shadow stay
           fixed relative to the print, and both switch off with the tracker. -->
      <ar-root
        reference-image="tracker"
        ar-lighting>
        <!-- Catches the model's shadow onto the print itself. Invisible except
             where the light is blocked, so it darkens the camera feed and
             nothing else. -->
        <a-entity
          id="ar-ground"
          ar-shadow-catcher></a-entity>

        <!-- Stage: tilts the model's Y-up into marker Z-up, holds it above the
             print, and plays the entrance animation on every acquisition. -->
        <a-entity
          id="ar-stage"
          rotation="90 0 0"
          ar-reveal>
          <a-entity
            id="facing-worlds-model"
            gltf-model="#facing-worlds-map"
            ar-model-fit
            shadow="cast: true; receive: true"></a-entity>
        </a-entity>
      </ar-root>
    </a-scene>
  </body>
</html>
