<!DOCTYPE html>
<!--
  Facing Worlds AR - a live spectator table.

  Point a phone at the printed marker and the Facing Worlds map appears anchored to it,
  perfectly still, with every player currently in the game standing on it in real time.
  The stillness is the point: encantar gives a full 6DoF pose relative to the print, so
  a model that does not move is a model you can walk around.

  This page is pure Three.js. A-Frame was dropped deliberately - see src/ar/three/main.js
  for the reasoning.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta
      name="theme-color"
      content="#000000" />
    <meta
      name="description"
      content="Watch a live Facing Worlds match on your table, in augmented reality." />
    <title>Facing Worlds AR</title>

    <style>
      :root {
        --ink: #e8eef7;
        --dim: #93a4bb;
        --live: #57e08a;
        --warn: #ffb84a;
        --dead: #ff5a5a;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* encantar takes this container over completely: it sets position, size and
         z-index on every resize. It only needs to exist. */
      #ar-viewport {
        position: fixed;
        inset: 0;
      }

      /* The HUD container is handed to encantar, which requires it to start hidden and
         relocates it into the viewport's sub-container when the session begins. */
      #ar-hud {
        pointer-events: none;
      }

      /* --- scan hint: shown exactly while the marker is not tracked --------- */
      #ar-scan {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        justify-items: center;
        text-align: center;
      }

      #ar-scan[hidden] {
        display: none;
      }

      .scan-frame {
        width: min(58vw, 58vh);
        aspect-ratio: 1;
        position: relative;
        opacity: 0.75;
        animation: scan-pulse 2.4s ease-in-out infinite;
      }

      .scan-frame span {
        position: absolute;
        width: 26%;
        height: 26%;
        border: 3px solid var(--ink);
      }
      .scan-frame span:nth-child(1) {
        top: 0;
        left: 0;
        border-right: 0;
        border-bottom: 0;
        border-radius: 10px 0 0 0;
      }
      .scan-frame span:nth-child(2) {
        top: 0;
        right: 0;
        border-left: 0;
        border-bottom: 0;
        border-radius: 0 10px 0 0;
      }
      .scan-frame span:nth-child(3) {
        bottom: 0;
        right: 0;
        border-left: 0;
        border-top: 0;
        border-radius: 0 0 10px 0;
      }
      .scan-frame span:nth-child(4) {
        bottom: 0;
        left: 0;
        border-right: 0;
        border-top: 0;
        border-radius: 0 0 0 10px;
      }

      @keyframes scan-pulse {
        0%,
        100% {
          opacity: 0.35;
          transform: scale(0.97);
        }
        50% {
          opacity: 0.85;
          transform: scale(1);
        }
      }

      .scan-label {
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      }

      .scan-sub {
        font-size: 0.8rem;
        color: var(--dim);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.9);
      }

      /* --- spectator chip --------------------------------------------------- */
      #ar-spectator {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 0.9rem);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.38rem 0.8rem;
        border-radius: 999px;
        background: rgba(8, 12, 20, 0.66);
        backdrop-filter: blur(6px);
        font-size: 0.75rem;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }

      #ar-spectator::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dead);
      }
      #ar-spectator[data-state="online"]::before {
        background: var(--live);
      }
      #ar-spectator[data-state="connecting"]::before {
        background: var(--warn);
      }

      /* --- match: score line + team roster -----------------------------------
         The reason a spectator is watching is Capture the Flag, so the score is
         the one number that has to be readable without looking away from the
         table. It sits under the connection chip; the roster hangs below it and
         is the only place a name is legible at all - the 3D labels are three
         millimetres tall on the print. */
      #ar-match {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 3rem);
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 0.4rem;
        max-width: min(88vw, 22rem);
      }

      #ar-match[hidden] {
        display: none;
      }

      #ar-score {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.3rem 0.75rem;
        border-radius: 999px;
        background: rgba(8, 12, 20, 0.66);
        backdrop-filter: blur(6px);
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }

      /* The two team colours, and the ONLY place they are written in CSS. They
         match AR_CONFIG.avatar.teamColors, which is what tints the figures and
         the flags in the scene - a HUD that disagreed with the table would be
         worse than no HUD. */
      #ar-score-red {
        color: rgb(255, 92, 92);
      }
      #ar-score-blue {
        color: rgb(92, 168, 255);
      }
      .score-dash {
        color: var(--dim);
      }
      #ar-score-note {
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--dim);
      }

      #ar-roster {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.25rem 0.35rem;
      }

      #ar-roster li {
        display: flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.15rem 0.5rem 0.15rem 0.35rem;
        border-radius: 999px;
        background: rgba(8, 12, 20, 0.58);
        font-size: 0.68rem;
        letter-spacing: 0.03em;
        max-width: 10rem;
      }

      #ar-roster li.is-dead {
        opacity: 0.42;
      }

      #ar-roster .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--dim);
      }

      #ar-roster li[data-team="red"] .dot {
        background: rgb(239, 0, 0);
      }
      #ar-roster li[data-team="blue"] .dot {
        background: rgb(0, 120, 239);
      }

      #ar-roster .who {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Somebody is carrying a flag. The single most interesting fact on screen. */
      #ar-roster .carrying {
        font-size: 0.62rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #ar-roster .carrying[data-flag="red"] {
        color: rgb(255, 92, 92);
      }
      #ar-roster .carrying[data-flag="blue"] {
        color: rgb(92, 168, 255);
      }

      /* --- boot overlay: outside the viewport so encantar never touches it --- */
      #ar-boot {
        position: fixed;
        inset: 0;
        z-index: 2000000000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #05070c;
        transition: opacity 420ms ease;
      }

      #ar-boot.is-gone {
        opacity: 0;
        pointer-events: none;
      }

      #ar-boot.is-error .boot-spinner {
        display: none;
      }
      #ar-boot.is-error #ar-boot-text {
        color: var(--dead);
      }

      .boot-title {
        font-size: 1.05rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      #ar-boot-text {
        font-size: 0.85rem;
        color: var(--dim);
        max-width: 26ch;
        line-height: 1.5;
      }

      .boot-spinner {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 2px solid rgba(232, 238, 247, 0.2);
        border-top-color: var(--ink);
        animation: boot-spin 900ms linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .scan-frame,
        .boot-spinner {
          animation: none;
        }
      }
    </style>

    <!--
      encantar.js. A classic script, so window.AR exists before any module runs.
      The Three.js plugin next to it is an ES module and is imported from
      src/ar/three/main.js instead.
    -->
    <script src="../assets/libraries/encantar/encantar.min.js"></script>

    <!--
      ONE three.js instance, and only one.

      The encantar Three.js plugin and every module under src/ar/three/ import the bare
      specifier "three". This import map points that at the vendored r180 build. A
      second copy of three anywhere on the page would give the plugin's Group/Camera
      different class identities than the ones the renderer checks with instanceof, and
      the failures that produces are baffling - so there is exactly one entry here and
      nothing else loads three.

      Note it must be three.module.min.js: the unminified three.module.js in the same
      folder imports "./three.core.js", which is not vendored, and would 404.
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "../assets/libraries/three/three.module.min.js"
        }
      }
    </script>

    <script
      type="module"
      src="../ar.js"></script>
  </head>

  <body>
    <!-- Handed to encantar as the viewport container. It styles and fills this. -->
    <div id="ar-viewport">
      <!-- Handed to encantar as the HUD container. It MUST start hidden: encantar
           warns and hides it otherwise, and it unhides it when the session starts. -->
      <div
        id="ar-hud"
        hidden>
        <div
          id="ar-scan"
          hidden>
          <div class="scan-frame">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="scan-label">Point at the marker</div>
          <div
            id="ar-scan-sub"
            class="scan-sub">
            The map appears on the print. Walk around it.
          </div>
        </div>

        <div
          id="ar-spectator"
          data-state="offline">
          <span id="ar-spectator-text">offline</span>
        </div>

        <!-- The match. Hidden until the server has actually said there is one,
             so a page pointed at a server with no CTF never shows a 0 - 0. -->
        <div
          id="ar-match"
          hidden>
          <div id="ar-score">
            <span id="ar-score-red">0</span>
            <span class="score-dash">&mdash;</span>
            <span id="ar-score-blue">0</span>
            <span id="ar-score-note"></span>
          </div>
          <ul id="ar-roster"></ul>
        </div>
      </div>
    </div>

    <!-- Boot / failure overlay. Deliberately a sibling of the viewport: encantar
         attaches a closed shadow root inside the viewport, and this has to stay
         reachable and paint before any module has executed. -->
    <div id="ar-boot">
      <div class="boot-spinner"></div>
      <div class="boot-title">Facing Worlds</div>
      <div id="ar-boot-text">Starting the camera and loading the map&hellip;</div>
    </div>
  </body>
</html>
